<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>💰 Mis Finanzas</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA -->
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Gestor personal de finanzas mensuales">
  <link rel="manifest" href="manifest.json">

  <!-- iOS: soporte para instalar como app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>
  <!-- ... todo el contenido igual ... -->

  <script src="app.js"></script>

  <script>
    // Registrar service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[PWA] SW registrado. Scope:', reg.scope))
          .catch(err => console.warn('[PWA] Error SW:', err));
      });
    }
  </script>
</body>
</html>
